model:
  backbone:
    class_path: geoloc.models.backbones.MixVPRResNetBackbone
    init_args:
      model_name: resnet50
      layers_to_crop: [4]
      layers_to_freeze: 1
  aggregator:
    class_path: geoloc.models.aggregators.MixVPR
    init_args:
      in_channels: 1024
      in_h: 32
      in_w: 32
      out_channels: 1024
      mix_depth: 4
      mlp_ratio: 1
      out_rows: 4

  optimizer:
    class_path: torch.optim.AdamW
    init_args:
      lr: 6.0e-5
      weight_decay: 9.5e-9
  scheduler:
    class_path: torch.optim.lr_scheduler.LinearLR
    init_args:
      start_factor: 1
      end_factor: 0.2
      total_iters: 4000
  loss: 
    class_path: pytorch_metric_learning.losses.MultiSimilarityLoss
    init_args:
      alpha: 1.0
      beta: 50
      base: 0.0
      distance: 
        class_path: pytorch_metric_learning.distances.CosineSimilarity
  miner:
    class_path: pytorch_metric_learning.miners.MultiSimilarityMiner
    init_args:
      epsilon: 0.1
  faiss_gpu: False

trainer:
  accelerator: gpu
  devices: 1
  default_root_dir: ./logs/
  num_nodes: 1
  num_sanity_val_steps: 0
  precision: 16-mixed
  max_epochs: 10
  check_val_every_n_epoch: 1
  reload_dataloaders_every_n_epochs: 1
  log_every_n_steps: 20