savedir: &savedir /storage/datasets/AerialLoc/Drone2Sat/vdbs/anyloc/VisLoc/debug

fitstep: 5
vlad_prefitted: /storage/datasets/AerialLoc/Drone2Sat/ckpts/anyloc_aerial_c_centers/c_centers.pt

model:
  class_path: geoloc.models.relatedwork.anyloc.AnyLoc
  init_args:
    backbone:
      class_path: geoloc.models.backbones.AnyLocDINOv2Backbone
      init_args:
        facet: value
        layer: 31
    aggregator:
      class_path: geoloc.models.aggregators.vlad.VLAD
      init_args:
        num_clusters: 32
        vlad_mode: hard
        desc_dim: 1536
        cache_dir: *savedir

dataset:
  class_path: geoloc.data.datasets.VisLoc.VisLocReferenceImages
  init_args:
    root: /storage/datasets/AerialLoc/UAV_VisLoc/
    flight_idx: 5
    tile_size: 1000
    stride: null
    transforms: null
