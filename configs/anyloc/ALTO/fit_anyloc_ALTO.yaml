savedir: &savedir /storage/datasets/AerialLoc/Drone2Sat/vdbs/anyloc/ALTO/paper

fitstep: 5
vlad_prefitted: /storage/datasets/AerialLoc/Drone2Sat/ckpts/anyloc_aerial_c_centers/c_centers.pt

anyloc:
  class_path: geoloc.relatedwork.anyloc.AnyLoc
  init_args:
    backbone:
      class_path: geoloc.models.backbones.AnyLocDINOv2Backbone
      init_args:
        facet: value
        layer: 31
    vlad:
      _fit_step: 10
      _use_prefitted: True
      class_path: geoloc.models.aggregators.vlad.VLAD
      init_args:
        num_clusters: 32
        vlad_mode: hard
        desc_dim: 1536
        cache_dir: *savedir

dataset:
  class_path: geoloc.data.datasets.ALTO.ALTOReferenceImages
  init_args:
    root: /storage/datasets/AerialLoc/ALTO
    round: 1
    split: Val