model:
  class_path: geoloc.models.relatedwork.anyloc.AnyLoc
  init_args:
    backbone:
      class_path: geoloc.models.backbones.AnyLocDINOv2Backbone
      init_args:
        model_name: "dinov2_vitg14"
        facet: value
        layer: 31
    aggregator:
      class_path: geoloc.models.aggregators.vlad.VLAD
      init_args:
        num_clusters: 32
        vlad_mode: hard
        desc_dim: 1536
        cache_dir: null
    rotator:
      class_path: geoloc.models.canori.ctonn.LCTONN
      load_checkpoint: /home/grega/geoloc/logs/checkpoints/lctonn/VPAir/lctonn_ds:VPAirTrainDataset_north-align_ep:300_20260112_103729/epoch=249-step=019500.ckpt
    # fit_step: 5
  load_checkpoint: /storage/datasets/AerialLoc/Drone2Sat/ckpts/anyloc_aerial_c_centers


dataset:
  class_path: geoloc.data.datasets.VPAir.VPAirTestDatasetReferenceImages
  init_args:
    root: /storage/datasets/AerialLoc/Drone2Sat/VPAir
    include_distractors: False
    # canonical_ori: True

dataloader:
  batch_size: 8
  shuffle: False
  num_workers: 2

trainer: # Lightning Trainer config
  max_epochs: 1
  default_root_dir: './logs/'
  accelerator: gpu
  devices: 1
  num_sanity_val_steps: 0
  check_val_every_n_epoch: 1

logger: # WandbLogger config
  offline: False
  save_dir: /home/grega/geoloc/logs/

build_config: !include build_config.yaml
benchmark_config: !include benchmark_config.yaml
