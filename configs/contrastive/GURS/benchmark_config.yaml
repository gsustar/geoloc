VISUALIZE_TOP_K: False
VISUALIZE_HEATMAP: False
SAVE_SALAD_MATRIX: False

every_n: 50
benchmark_top_k: [1, 5, 10, 25, 50, 100]
benchmark_recall_at_xmeters: [100, 150, 200, 250, 500, 1000]

# radius_search_meters: 5000.0
# confidence_pass_streak_threshold: 0

dataset:
  class_path: geoloc.data.datasets.ViCoS.AformXQueryImages
  init_args:
    query_dir: /storage/private/MORS/AFORMX_GOPRO/frames_3fps_1080p/AFormX-flight3-part3
    metadata_path: /storage/private/MORS/AFORMX_GOPRO/frames_3fps_1080p/AFormX-flight3-part3_3fps_1080p_telemetry.csv
    skip_first_n_frames: 600
    skip_last_n_frames: 600
    transforms:
      class_path: torchvision.transforms.Compose
      init_args:
        transforms:
          - class_path: torchvision.transforms.CenterCrop
            init_args:
              size: [1080, 1080]
          - class_path: torchvision.transforms.Resize
            init_args:
              size: [512, 512]

reranking:
  batch_size: 1
  # rotations: [0, 90, 180, 270]
  matcher:
    class_path: geoloc.models.reranking.RomaMatchAnythingMatcher
    init_args:
      weights_path: /storage/datasets/AerialLoc/Drone2Sat/ckpts/matchanything_weights/matchanything_roma.ckpt
      coarse_res: 448 
      upsample_preds: False
      symmetric: False
      num_sample_keypoints: 3840
      do_compile: False

  ransac:
    class_path: geoloc.models.reranking.OpenCVRANSAC
    init_args:
      reproj_threshold: 1.0
      maxIters: 5000
