model:
  class_path: geoloc.models.relatedwork.salad.SALADModel
  init_args:
    backbone:
      class_path: geoloc.models.backbones.HFaceDINOBackbone
      init_args:
        pretrained_model_name_or_path: facebook/dinov3-vitb16-pretrain-lvd1689m
        return_cls_token: True
        num_trainable_blocks: 4
    aggregator:
      class_path: geoloc.models.aggregators.SALAD
      init_args:
        num_channels: 768
        num_clusters: 64
        cluster_dim: 128
        token_dim: 256
    optimizer:
      class_path: torch.optim.AdamW
      init_args:
        lr: 6.0e-5
        weight_decay: 9.5e-9
    scheduler:
      class_path: torch.optim.lr_scheduler.LinearLR
      init_args:
        start_factor: 1
        end_factor: 0.2
        total_iters: 4000
    loss: 
      class_path: pytorch_metric_learning.losses.MultiSimilarityLoss
      init_args:
        alpha: 1.0
        beta: 50
        base: 0.0
        distance: 
          class_path: pytorch_metric_learning.distances.CosineSimilarity
    miner:
      class_path: pytorch_metric_learning.miners.MultiSimilarityMiner
      init_args:
        epsilon: 0.1
    faiss_gpu: False
  load_checkpoint: /storage/datasets/AerialLoc/Drone2Sat/ckpts/salad/dino_salad.ckpt

dataset:
  class_path: geoloc.data.datasets.VPAir.VPAirTrainDataset
  init_args:
    root: /storage/datasets/AerialLoc/Drone2Sat/VPAir
    north_align: False
    transforms:
      class_path: torchvision.transforms.Compose
      init_args:
        transforms:
          - class_path: torchvision.transforms.Resize
            init_args:
              size: [504, 504]
          - class_path: geoloc.data.transforms.CircleMaskCrop
          - class_path: torchvision.transforms.RandomRotation
            init_args:
              degrees: 180

dataloader:
  batch_size: 32
  num_workers: 4
  shuffle: True
  drop_last: True
  pin_memory: False

trainer:
  accelerator: 'gpu'
  devices: 1
  default_root_dir: './logs/'
  num_nodes: 1
  num_sanity_val_steps: 0
  precision: '16-mixed'
  max_epochs: 100
  check_val_every_n_epoch: 5
  reload_dataloaders_every_n_epochs: 1
  log_every_n_steps: 20
  gradient_clip_val: 1.0

logger: # WandbLogger config
  offline: True
  save_dir: /home/grega/geoloc/logs/

build_config: !include contrastive_build.yaml
benchmark_config: !include contrastive_benchmark.yaml